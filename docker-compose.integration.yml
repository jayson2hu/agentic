services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codepick_l2
      POSTGRES_USER: codepick
      POSTGRES_PASSWORD: codepick
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepick -d codepick_l2"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

