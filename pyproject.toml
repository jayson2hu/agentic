[project]
name = "codepick-l2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0.4",
  "pydantic>=2.7.4",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "arq>=0.26",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["packages/judgment_graph"]
include = ["judgment_graph*"]

[tool.setuptools.package-data]
judgment_graph = ["config/verticals/*.json"]

[tool.pytest.ini_options]
pythonpath = ["packages/judgment_graph"]
testpaths = ["packages/judgment_graph/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["judgment_graph"]
exclude = [
  "packages/judgment_graph/judgment_graph/graph/langgraph_build.py",
]
